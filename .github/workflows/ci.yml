name: Verix Zero-Trust DevSecOps CI & Supply Chain Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Explicit least-privilege GITHUB_TOKEN permissions at workflow root
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # ============================================================================
  # Job 1: Quality Gates & Shift-Left SCA (Lint, PQC Conformance, Tests, Audit)
  # ============================================================================
  quality-and-sca:
    name: Lint, PQC Self-Test, Unit Tests & SCA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deterministic dependencies
        run: npm ci --ignore-scripts

      - name: Gate 1 — AST & Module Lint Check
        run: npm run lint

      - name: Gate 2 — Post-Quantum Cryptographic Conformance Self-Test
        run: npm run selftest

      - name: Gate 3 — Unit & Integration Test Suite
        run: npm test

      - name: Gate 4 — Software Composition Analysis (SCA - npm audit)
        run: npm audit --audit-level=high

  # ============================================================================
  # Job 2: Shift-Left SAST (GitHub CodeQL Static Analysis)
  # ============================================================================
  sast-codeql:
    name: SAST (CodeQL Security Analysis)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  # ============================================================================
  # Job 3: Container Build, Zero-Trust Smoke Test, Trivy CVE Scan, Syft SBOM & Cosign
  # ============================================================================
  container-supply-chain:
    name: Build, Scan (Trivy), SBOM (Syft) & Sign (Cosign)
    runs-on: ubuntu-latest
    needs: [quality-and-sca, sast-codeql]
    permissions:
      contents: read
      packages: write
      id-token: write          # Required for Sigstore Cosign keyless OIDC signing
      attestations: write      # Required for SLSA build provenance & SBOM attestation
      security-events: write   # Required to upload Trivy SARIF report to GitHub Security tab
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Normalize lowercase GHCR image name
        id: meta
        run: |
          IMAGE_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=${IMAGE_LC}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Zero-Trust Production Image (Local Load for Scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: verix-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Zero-Trust Runtime Constraints (Read-Only Root FS + Dropped Caps + Non-Root)
        run: |
          docker run -d --name verix-smoke \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges:true \
            --tmpfs /var/lib/verix:rw,noexec,nosuid,uid=1000,gid=1000 \
            -e VERIX_ADMIN_TOKEN=ci-smoke-test-token \
            -p 4317:4317 \
            verix-api:${{ github.sha }}

          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:4317/health > /dev/null; then
              echo "Verix container passed read-only rootfs & dropped-capabilities health check"
              break
            fi
            if [ "$i" -eq 15 ]; then
              docker logs verix-smoke
              exit 1
            fi
            sleep 1
          done

          # Confirm process is running as UID 1000 (node), NOT root (UID 0)
          RUNNING_UID=$(docker exec verix-smoke id -u)
          if [ "$RUNNING_UID" != "1000" ]; then
            echo "SECURITY VIOLATION: Container running as UID $RUNNING_UID instead of 1000"
            exit 1
          fi

          # Confirm /app/src/crypto/pqc.js is owned by root:root (0:0) for Defense-in-Depth
          CODE_OWNER=$(docker exec verix-smoke stat -c "%u:%g" /app/src/crypto/pqc.js)
          if [ "$CODE_OWNER" != "0:0" ]; then
            echo "SECURITY VIOLATION: Application code owned by $CODE_OWNER instead of 0:0 (root:root)"
            exit 1
          fi
          docker rm -f verix-smoke

      - name: Gate 5 — Container Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: verix-api:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Generate CycloneDX SBOM with Syft (Task 1.3 - SLSA Supply Chain)
        uses: anchore/sbom-action@v0
        with:
          image: verix-api:${{ github.sha }}
          format: cyclonedx-json
          output-file: verix-sbom.cdx.json
          upload-artifact: true

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Hardened Image to GHCR by Digest
        id: push_image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}:latest
          cache-from: type=gha

      - name: Install Sigstore Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3

      - name: Sign Container Image & Attach SBOM Attestation with Cosign (Keyless OIDC)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          IMAGE_DIGEST="${{ env.REGISTRY }}/${{ steps.meta.outputs.image_name }}@${{ steps.push_image.outputs.digest }}"
          cosign sign --yes "${IMAGE_DIGEST}"
          cosign attest --yes --predicate verix-sbom.cdx.json --type cyclonedx "${IMAGE_DIGEST}"
